<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="auth-container">
    <div id="login-box">
        <h2>Login</h2>

        <form id="login-form">
            <input type="email" id="login-email" placeholder="Enter your email" required>
            <input type="password" id="login-password" placeholder="Enter your password" required>
            <button type="submit">Login</button>
        </form>

        <p id="login-message" style="text-align:center; margin-top:10px;"></p>

        <p style="text-align:center; margin-top:10px;">
            <a href="#" id="show-forgot">Forgot Password?</a>
        </p>

        <p style="text-align:center;">
            Don't have an account? <a href="#" id="show-signup">Sign Up</a>
        </p>
    </div>

    <div id="signup-box" style="display:none;">
        <h2>Create Account</h2>

        <form id="signup-form">
            <input type="text" id="signup-name" placeholder="Full Name" required>
            <input type="email" id="signup-email" placeholder="Email Address" required>
            <input type="password" id="signup-password" placeholder="Create Password" required>
            <button type="submit">Sign Up</button>
        </form>

        <p id="signup-message" style="text-align:center; margin-top:10px;"></p>

        <p style="text-align:center;">
            Already have an account? <a href="#" id="show-login">Login</a>
        </p>
    </div>

    <div id="forgot-box" style="display:none;">
        <h2>Reset Password</h2>

        <form id="forgot-form">
            <input type="email" id="forgot-email" placeholder="Enter your email" required>
            <input type="password" id="new-password" placeholder="New password" required>
            <button type="submit">Reset Password</button>
        </form>

        <p id="forgot-message" style="text-align:center; margin-top:10px;"></p>

        <p style="text-align:center;">
            <a href="#" id="back-login">Back to Login</a>
        </p>
    </div>
</div>

<div id="welcome-screen" style="display:none;">
    <h1 id="welcome-text"></h1>
</div>

<div id="app" style="display:none;">

    <h1>Expense Tracker</h1>

    <h2>Total: ₦ <span id="total">0</span></h2>

    <form id="form">
        <input type="text" id="desc" placeholder="What did you spend on?" required>
        <input type="number" id="amount" placeholder="Enter amount" required>

        <select id="category" required>
            <option value="">Select Category</option>
            <option>Food</option>
            <option>Transport</option>
            <option>Entertainment</option>
            <option>Other</option>
        </select>

        <button type="submit">Add Expense</button>
    </form>

    <p id="empty-msg">No expenses yet</p>

    <!-- 🔥 Expense list -->
    <ul id="list" class="expense-list"></ul>

    <button id="logout-btn">Logout</button>

</div>

<script src="script.js"></script>
</body>
</html>
