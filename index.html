<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>
<link rel="stylesheet" href="style.css?v=7">
</head>

<body>

<!-- AUTH -->
<div id="auth-wrapper">

    <!-- LEFT -->
    <div class="left-panel">
        <h1>Expense Tracker</h1>
        <p>Take control of your money and track every expense easily.</p>
    </div>

    <!-- RIGHT -->
    <div class="right-panel">
        <div id="auth-container">

            <!-- LOGIN -->
            <div id="login-box">
                <h2>Login</h2>

                <form id="login-form">
                    <input type="email" placeholder="Email" required>
                    <input type="password" placeholder="Password" required>
                    <button type="submit">Login</button>
                </form>

                <p><a href="#" id="show-forgot">Forgot Password?</a></p>
                <p>Don't have an account? <a href="#" id="show-signup">Sign Up</a></p>
            </div>

            <!-- SIGNUP -->
            <div id="signup-box" style="display:none;">
                <h2>Create Account</h2>

                <form id="signup-form">
                    <input type="text" placeholder="Full Name" required>
                    <input type="email" placeholder="Email" required>
                    <input type="password" placeholder="Password" required>
                    <button type="submit">Sign Up</button>
                </form>

                <p>Already have an account? <a href="#" id="show-login">Login</a></p>
            </div>

            <!-- FORGOT -->
            <div id="forgot-box" style="display:none;">
                <h2>Reset Password</h2>

                <form id="forgot-form">
                    <input type="email" placeholder="Enter your email" required>
                    <button type="submit">Send Reset Link</button>
                </form>

                <p><a href="#" id="back-login">Back to Login</a></p>
            </div>

        </div>
    </div>
</div>

<!-- APP -->
<div id="app">

    <h1>Expense Tracker</h1>
    <h2>Total: ₦ <span id="total">0</span></h2>

    <form id="form">
        <input type="text" id="desc" placeholder="Description" required>
        <input type="number" id="amount" placeholder="Amount" required>

        <select id="category">
            <option>Food</option>
            <option>Transport</option>
            <option>Other</option>
        </select>

        <button type="submit">Add</button>
    </form>

    <ul id="list"></ul>

    <button id="logout-btn">Logout</button>

</div>

<script src="script.js"></script>

</body>
</html>
